spring.application.name=ems-backend
server.port=8080

# ---------- MySQL ----------
# Credentials come from environment variables in real deployments; defaults are for local dev only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:ems_user}
spring.datasource.password=${DB_PASSWORD:ems_pass_2025}

# ---------- JPA / Hibernate ----------
# 'update' keeps the schema in sync with entities during development.
# In production this would be 'validate' with Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Base64-encoded 256-bit key. Override with JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:ZW1zLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- CORS ----------
# Needed only when the frontend is served from a different origin without a proxy.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Seed data ----------
app.seed.enabled=${SEED_ENABLED:true}
